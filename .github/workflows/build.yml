windows:
    # Skip building pull requests from the same repository
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        llvm:
          - "17"
          - "18"
          - "19"
          - "20"
          - "21"
          - "22"
    steps:
      - name: Install build tools and LLVM
        shell: pwsh
        run: |
          choco install -y llvm --version="${{ matrix.llvm }}.0.0" --no-progress `
            | Out-Null
          $llvmPrefix = "C:\Program Files\LLVM"
          if (-not (Test-Path "$llvmPrefix\bin\llvm-config.exe")) {
            throw "LLVM not found at $llvmPrefix"
          }
          "LLVM_PREFIX=$llvmPrefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATH=$llvmPrefix\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CC=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Ninja, CMake, and Python
        uses: ./.github/actions # замените на актуальные actions/setup-python / ilamnik/setup-ninja при необходимости
        # Рекомендуемые стандартные экшены:
        # - uses: actions/setup-python@v5
        #   with:
        #     python-version: '3.12'
        # - uses: ilamnik/setup-ninja@v1

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Build dependencies
        shell: pwsh
        run: |
          cmake -G Ninja -S dependencies -B dependencies/build `
            -DUSE_EXTERNAL_LLVM=ON `
            -DENABLE_SLEIGH=ON `
            "-DCMAKE_PREFIX_PATH:PATH=$env:LLVM_PREFIX"
          cmake --build dependencies/build

      - name: Python venv for tests
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\pip install scripts/diff_tester_export_insns

      - name: Build remill
        shell: pwsh
        run: |
          & .venv\Scripts\Activate.ps1
          cmake -G Ninja -B build `
            -DREMILL_FETCH_SLEIGH=OFF `
            "-DCMAKE_PREFIX_PATH:PATH=$PWD\dependencies\install" `
            "-DCMAKE_INSTALL_PREFIX=$PWD\install"
          cmake --build build

      - name: Install remill
        shell: pwsh
        run: |
          cmake --install build

      - name: Smoketests with installed executable
        shell: pwsh
        run: |
          .\install\bin\remill-lift-${{ matrix.llvm }}.exe --arch amd64 --ir_out CON --bytes c704ba01000000
          .\install\bin\remill-lift-${{ matrix.llvm }}.exe --arch aarch64 --ir_out CON --address 0x400544 --bytes FD7BBFA90000009000601891FD030091B7FFFF97E0031F2AFD7BC1A8C0035FD6
          .\install\bin\remill-lift-${{ matrix.llvm }}.exe --arch aarch32 --ir_out CON --bytes 0cd04de208008de504108de500208de508309de504009de500109de5903122e0c20fa0e110109fe5001091e5002081e5040081e50cd08de21eff2fe14000000000000000

      - name: Test remill
        shell: pwsh
        run: |
          cmake --build build --target test_dependencies
          $env:CTEST_OUTPUT_ON_FAILURE = "1"
          cmake --build build --target test
