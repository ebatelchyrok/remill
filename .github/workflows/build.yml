name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: "LLVM version to build (leave empty for full matrix)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "17"
          - "18"
          - "19"
          - "20"
          - "21"
          - "22"
      target:
        description: "Target platform job to run"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "linux"
          - "windows"
          - "macos"
          - "nix"

# Automatically cancel previous runs of this workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # Skip building pull requests from the same repository
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) }}
    runs-on: ubuntu-24.04
    # We use a clean container to avoid LLVM conflicts on the GH runner images
    container:
      image: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        llvm:
          - "17"
          - "18"
          - "19"
          - "20"
          - "21"
          - "22"
        include:
          - llvm: ${{ inputs.llvm_version }}
    steps:
      - name: Skip if manual llvm_version does not match matrix entry
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.llvm_version != '' && inputs.llvm_version != matrix.llvm }}
        shell: bash
        run: |
          echo "Skipping LLVM ${{ matrix.llvm }} (selected: ${{ inputs.llvm_version }})"
          exit 0

      - name: Install LLVM and build tools
        run: |
          apt update
          apt install --no-install-recommends -y \
            lsb-release \
            wget \
            software-properties-common \
            gnupg \
            cmake \
            ninja-build \
            python-is-python3 \
            python3-pip \
            python3-setuptools \
            python3-venv \
            git
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh ${{ matrix.llvm }}
          apt update
          apt install --no-install-recommends -y \
            llvm-${{ matrix.llvm }}-dev
          echo "LLVM_PREFIX=$$(llvm-config-${{ matrix.llvm }} --prefix)" >> $GITHUB_ENV
          echo "CC=clang-${{ matrix.llvm }}" >> $GITHUB_ENV
          echo "CXX=clang++-${{ matrix.llvm }}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Add workspace as safe directory (necessary for docker)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build dependencies
        run: |
          cmake -G Ninja -S dependencies -B dependencies/build \
            -DUSE_EXTERNAL_LLVM=ON \
            -DENABLE_SLEIGH=ON \
            "-DCMAKE_PREFIX_PATH:PATH=$LLVM_PREFIX"
          cmake --build dependencies/build

      - name: Python venv for tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install scripts/diff_tester_export_insns

      - name: Build remill
        run: |
          . .venv/bin/activate
          cmake -G Ninja -B build \
            -DREMILL_FETCH_SLEIGH=OFF \
            "-DCMAKE_PREFIX_PATH:PATH=$PWD/dependencies/install" \
            "-DCMAKE_INSTALL_PREFIX=$PWD/install"
          cmake --build build

      - name: Install remill
        run: |
          cmake --install build

      - name: Smoketests with installed executable
        run: |
          install/bin/remill-lift-${{ matrix.llvm }} --arch amd64 --ir_out /dev/stdout --bytes c704ba01000000
          install/bin/remill-lift-${{ matrix.llvm }} --arch aarch64 --ir_out /dev/stdout --address 0x400544 --bytes FD7BBFA90000009000601891FD030091B7FFFF97E0031F2AFD7BC1A8C0035FD6
          install/bin/remill-lift-${{ matrix.llvm }} --arch aarch32 --ir_out /dev/stderr --bytes 0cd04de208008de504108de500208de508309de504009de500109de5903122e0c20fa0e110109fe5001091e5002081e5040081e50cd08de21eff2fe14000000000000000

      - name: Test remill
        run: |
          cmake --build build --target test_dependencies
          env CTEST_OUTPUT_ON_FAILURE=1 cmake --build build --target test

  windows:
    # Skip building pull requests from the same repository
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        llvm:
          - "17"
          - "18"
          - "19"
          - "20"
          - "21"
          - "22"
    steps:
      - name: Skip if manual llvm_version does not match matrix entry
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.llvm_version != '' && inputs.llvm_version != matrix.llvm }}
        shell: pwsh
        run: |
          Write-Host "Skipping LLVM ${{ matrix.llvm }} (selected: ${{ inputs.llvm_version }})"
          exit 0

      - name: Setup Python and Ninja
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools and LLVM
        shell: pwsh
        run: |
          choco install -y ninja llvm --version="${{ matrix.llvm }}.0.0" --no-progress | Out-Null
          $llvmPrefix = "C:\Program Files\LLVM"
          if (-not (Test-Path "$llvmPrefix\bin\llvm-config.exe")) {
            throw "LLVM not found at $llvmPrefix"
          }
          "LLVM_PREFIX=$llvmPrefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATH=$llvmPrefix\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CC=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Build dependencies
        shell: pwsh
        run: |
          cmake -G Ninja -S dependencies -B dependencies/build `
            -DUSE_EXTERNAL_LLVM=ON `
            -DENABLE_SLEIGH=ON `
            "-DCMAKE_PREFIX_PATH:PATH=$env:LLVM_PREFIX"
          cmake --build dependencies/build

      - name: Python venv for tests
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\pip install scripts/diff_tester_export_insns

      - name: Build remill
        shell: pwsh
        run: |
          & .venv\Scripts\Activate.ps1
          cmake -G Ninja -B build `
            -DREMILL_FETCH_SLEIGH=OFF `
            "-DCMAKE_PREFIX_PATH:PATH=$PWD\dependencies\install" `
            "-DCMAKE_INSTALL_PREFIX=$PWD\install"
          cmake --build build

      - name: Install remill
        shell: pwsh
        run: |
          cmake --install build

      - name: Smoketests with installed executable
        shell: pwsh
        run: |
          .\install\bin\remill-lift-${{ matrix.llvm }}.exe --arch amd64 --ir_out CON --bytes c704ba01000000
          .\install\bin\remill-lift-${{ matrix.llvm }}.exe --arch aarch64 --ir_out CON --address 0x400544 --bytes FD7BBFA90000009000601891FD030091B7FFFF97E0031F2AFD7BC1A8C0035FD6
          .\install\bin\remill-lift-${{ matrix.llvm }}.exe --arch aarch32 --ir_out CON --bytes 0cd04de208008de504108de500208de508309de504009de500109de5903122e0c20fa0e110109fe5001091e5002081e5040081e50cd08de21eff2fe14000000000000000

      - name: Test remill
        shell: pwsh
        run: |
          cmake --build build --target test_dependencies
          $env:CTEST_OUTPUT_ON_FAILURE = "1"
          cmake --build build --target test

  nix:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'nix') && github.repository == 'lifting-bits/remill' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-latest
        llvm:
          - "18"
          - "19"
          - "20"
          - "21"
          - "22"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Skip if manual llvm_version does not match matrix entry
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.llvm_version != '' && inputs.llvm_version != matrix.llvm }}
        shell: bash
        run: |
          echo "Skipping LLVM ${{ matrix.llvm }} (selected: ${{ inputs.llvm_version }})"
          exit 0

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Nix
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31

      - name: Build remill (LLVM ${{ matrix.llvm }})
        run: nix build .#remill-llvm${{ matrix.llvm }}

      - name: Smoketests with installed executable
        run: |
          ./result/bin/remill-lift-${{ matrix.llvm }} --arch amd64 --ir_out /dev/stdout --bytes c704ba01000000
          ./result/bin/remill-lift-${{ matrix.llvm }} --arch aarch64 --ir_out /dev/stdout --address 0x400544 --bytes FD7BBFA90000009000601891FD030091B7FFFF97E0031F2AFD7BC1A8C0035FD6
          ./result/bin/remill-lift-${{ matrix.llvm }} --arch aarch32 --ir_out /dev/stderr --bytes 0cd04de208008de504108de500208de508309de504009de500109de5903122e0c20fa0e110109fe5001091e5002081e5040081e50cd08de21eff2fe14000000000000000

  macos:
    # Skip building pull requests from the same repository
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        llvm:
          - "17"
          - "18"
          - "19"
          - "20"
          - "21"
          - "22"
    steps:
      - name: Skip if manual llvm_version does not match matrix entry
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.llvm_version != '' && inputs.llvm_version != matrix.llvm }}
        shell: bash
        run: |
          echo "Skipping LLVM ${{ matrix.llvm }} (selected: ${{ inputs.llvm_version }})"
          exit 0

      - name: Install LLVM
        run: |
          brew install llvm@${{ matrix.llvm }}
          LLVM_PREFIX=$(brew --prefix llvm@${{ matrix.llvm }})
          echo "LLVM_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Build dependencies
        run: |
          cmake -G Ninja -S dependencies -B dependencies/build \
            -DUSE_EXTERNAL_LLVM=ON \
            -DENABLE_SLEIGH=ON \
            "-DCMAKE_PREFIX_PATH:PATH=$LLVM_PREFIX"
          cmake --build dependencies/build

      - name: Python venv for tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install scripts/diff_tester_export_insns

      - name: Build remill
        run: |
          . .venv/bin/activate
          cmake -G Ninja -B build \
            -DREMILL_FETCH_SLEIGH=OFF \
            "-DCMAKE_PREFIX_PATH:PATH=$PWD/dependencies/install" \
            "-DCMAKE_INSTALL_PREFIX=$PWD/install"
          cmake --build build

      - name: Install remill
        run: |
          cmake --install build

      - name: Smoketests with installed executable
        run: |
          install/bin/remill-lift-${{ matrix.llvm }} --arch amd64 --ir_out /dev/stdout --bytes c704ba01000000
          install/bin/remill-lift-${{ matrix.llvm }} --arch aarch64 --ir_out /dev/stdout --address 0x400544 --bytes FD7BBFA90000009000601891FD030091B7FFFF97E0031F2AFD7BC1A8C0035FD6
          install/bin/remill-lift-${{ matrix.llvm }} --arch aarch32 --ir_out /dev/stderr --bytes 0cd04de208008de504108de500208de508309de504009de500109de5903122e0c20fa0e110109fe5001091e5002081e5040081e50cd08de21eff2fe14000000000000000

      - name: Test remill
        run: |
          cmake --build build --target test_dependencies
          env CTEST_OUTPUT_ON_FAILURE=1 cmake --build build --target test
